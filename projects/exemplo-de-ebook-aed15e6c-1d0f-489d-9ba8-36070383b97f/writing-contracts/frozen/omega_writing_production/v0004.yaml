id: omega_writing_production
version: 4
separator: "\n\n"
validation:
  allow_lists: false
  forbidden_phrases:
    - primeira parte
    - segunda parte
    - nesta parte
  linguistic_warnings:
    repeated_first_word: true
    repeated_initial: true
    repeated_article: true
    initial_run_length: 3
    articles: [o, a, os, as, um, uma]
units:
  - unit_id: INTRO
    order: 1
    character_count: &academic_character_count
      target: {min: 9000, max: 10000}
      accepted: {min: 7500, max: 11500}
    forbidden_headings: [Exercícios analíticos e aplicados]
    academic_context:
      projection_version: 2
      sections:
        - heading_pattern: '^(?:\d+\.\s*)?(?:objetivo geral|objetivos gerais)$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?(?:perfil dos estudantes|p[uú]blico-alvo)$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?(?:princ[ií]pios metodol[oó]gicos|fun[cç][aã]o did[aá]tica|fun[cç][aã]o e formato did[aá]tico|formato did[aá]tico)$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?(?:arquitetura geral do ebook|estrutura e escopo global|estrutura global|escopo global)$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?ementa(?: de trabalho)?$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?tema central$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?recorte acad[eê]mico$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?limites do escopo$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?necessidades de aprendizagem$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?estrat[eé]gia integradora do ebook$'
          heading_level: 1
          required: false
  - unit_id: CH01_A
    order: 2
    character_count: *academic_character_count
    continuity_from: [INTRO]
    forbidden_headings: [Exercícios analíticos e aplicados]
    academic_context: &chapter_01
      projection_version: 2
      sections:
        - heading_pattern: '^cap[ií]tulo 0?1(?:\s*(?:-|:)\s*.*)?$'
          heading_level: 1
  - unit_id: CH01_B
    order: 3
    character_count: *academic_character_count
    continuity_from: [CH01_A]
    required_headings: [Exercícios analíticos e aplicados]
    final_heading: Exercícios analíticos e aplicados
    academic_context: *chapter_01
  - unit_id: CH02_A
    order: 4
    character_count: *academic_character_count
    continuity_from: [CH01_B]
    forbidden_headings: [Exercícios analíticos e aplicados]
    academic_context: &chapter_02
