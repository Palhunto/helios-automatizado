    forbidden_headings: [Exercícios analíticos e aplicados]
    academic_context:
      projection_version: 2
      sections:
        - heading_pattern: '^(?:\d+\.\s*)?(?:objetivo geral|objetivos gerais)$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?resultados de aprendizagem$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?s[ií]ntese (?:do desenho pedag[oó]gico|global|dos resultados|acad[eê]mica)$'
          heading_level: 1
        - heading_pattern: '^(?:\d+\.\s*)?objetivos espec[ií]ficos$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?compet[eê]ncias a desenvolver$'
          heading_level: 1
          required: false
        - heading_pattern: '^(?:\d+\.\s*)?evid[eê]ncias de aprendizagem$'
