[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-ebook-automation"
version = "0.1.0"
description = "Local-first ebook production orchestration pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0", "playwright>=1.46"]

[project.scripts]
ebook = "ebook_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_pipeline"]

[tool.hatch.build]
include = [
  "src/ebook_pipeline/**/*.py",
  "src/ebook_pipeline/storage/sql/*.sql",
]
