id: omega_writing_production
version: 3
separator: "\n\n"
validation:
  allow_lists: false
  forbidden_phrases:
    - primeira parte
    - segunda parte
    - nesta parte
  linguistic_warnings:
    repeated_first_word: true
    repeated_initial: true
    repeated_article: true
    initial_run_length: 3
    articles: [o, a, os, as, um, uma]
units:
  - unit_id: INTRO
    order: 1
    character_count: &academic_character_count
      target: {min: 9000, max: 10000}
      accepted: {min: 7500, max: 11500}
    forbidden_headings: [Exercícios analíticos e aplicados]
    academic_context:
      projection_version: 1
      sections:
        - {heading_pattern: '^objetivo geral$', required: true}
        - {heading_pattern: '^s[ií]ntese da disciplina$', required: false}
        - {heading_pattern: '^perfil dos estudantes$', required: false}
        - {heading_pattern: '^tema(?:,| ) recorte e limites$', required: false}
  - unit_id: CH01_A
    order: 2
    character_count: *academic_character_count
    continuity_from: [INTRO]
    forbidden_headings: [Exercícios analíticos e aplicados]
    academic_context: &chapter_01
      projection_version: 1
      sections:
        - heading_pattern: '^cap[ií]tulo 0?1(?:\b|\s*[-:])'
          ancestor_pattern: '^planejamento (?:de cada|dos) cap[ií]tulos?$'
  - unit_id: CH01_B
    order: 3
    character_count: *academic_character_count
    continuity_from: [CH01_A]
    required_headings: [Exercícios analíticos e aplicados]
    final_heading: Exercícios analíticos e aplicados
    academic_context: *chapter_01
  - unit_id: CH02_A
    order: 4
    character_count: *academic_character_count
    continuity_from: [CH01_B]
    forbidden_headings: [Exercícios analíticos e aplicados]
