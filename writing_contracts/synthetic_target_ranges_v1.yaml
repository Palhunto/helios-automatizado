id: synthetic_target_ranges
version: 1
separator: "\n"
validation:
  allow_lists: false
  forbidden_phrases: []
  linguistic_warnings:
    repeated_first_word: false
    repeated_initial: false
    repeated_article: false
    initial_run_length: 3
    articles: [o, a]
units:
  - unit_id: FLEX
    order: 1
    character_count:
      target: {min: 40, max: 60}
      accepted: {min: 30, max: 80}
